<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">git-why</title>
  <desc id="d">git-why: ask your code why it exists. A strange line of code, time.sleep(37), gets explained from git history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1222"/>
      <stop offset="1" stop-color="#1b1430"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- left: title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="96" font-size="22" font-weight="600" fill="#ffb86b" letter-spacing="4">🏺  A SKILL FOR CLAUDE</text>
    <text x="68" y="200" font-size="112" font-weight="800" fill="url(#title)" letter-spacing="-3">git-why</text>
    <text x="72" y="256" font-size="34" font-weight="600" fill="#f4f1ff">Ask your code why it exists.</text>
    <text x="72" y="300" font-size="21" fill="#a9a4c7">Point at any weird line. Claude digs through the git</text>
    <text x="72" y="330" font-size="21" fill="#a9a4c7">history and tells you who added it, why, and if it’s</text>
    <text x="72" y="360" font-size="21" fill="#a9a4c7">safe to delete, with proof for every claim.</text>
  </g>

  <!-- right: code window -->
  <g transform="translate(700 70)">
    <rect width="520" height="168" rx="14" fill="#0b0d18" stroke="#2c2846"/>
    <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="22" r="6" fill="#febc2e"/>
    <circle cx="64" cy="22" r="6" fill="#28c840"/>
    <text x="96" y="27" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#6f6a92">payments/retry.py</text>
    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="17">
      <text x="24" y="66" fill="#6f6a92">41</text>
      <text x="64" y="66" fill="#c9c4ee"><tspan fill="#ff79c6">def</tspan> <tspan fill="#8be9fd">charge</tspan>(card):</text>
      <rect x="14" y="80" width="492" height="30" rx="6" fill="#ff6b8b" fill-opacity="0.16" stroke="#ff6b8b" stroke-opacity="0.6"/>
      <text x="24" y="101" fill="#6f6a92">42</text>
      <text x="64" y="101" fill="#f4f1ff">    time.sleep(<tspan fill="#ffb86b">37</tspan>)  <tspan fill="#6f6a92"># ???</tspan></text>
      <text x="24" y="136" fill="#6f6a92">43</text>
      <text x="64" y="136" fill="#c9c4ee">    <tspan fill="#ff79c6">return</tspan> gateway.send(card)</text>
    </g>
  </g>

  <!-- question bubble -->
  <g transform="translate(720 250)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="250" height="40" rx="20" fill="#2a2546"/>
    <text x="20" y="26" font-size="16" fill="#f4f1ff">why is this here? 🤔</text>
  </g>

  <!-- answer card -->
  <g transform="translate(800 296)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect width="420" height="126" rx="14" fill="#f4f1ff"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#1b1430">🏺 Added 2021 · commit a3f9c2e · PR #482</text>
    <text x="20" y="56" font-size="15" fill="#3d3760">The bank’s API blocks retries for 30+ seconds.</text>
    <text x="20" y="78" font-size="15" fill="#3d3760">Someone removed it once → double charges (#511).</text>
    <rect x="20" y="92" width="112" height="24" rx="12" fill="#ff6b8b"/>
    <text x="76" y="109" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🛑 KEEP IT</text>
    <text x="146" y="109" font-size="13" fill="#6f6a92">Confidence: high</text>
  </g>
</svg>
